# Each handler verifies the actual user token with Supabase Auth. A publishable
# key alone never authorizes private operations. Supports asymmetric Auth JWTs.
[functions.zuri-api]
verify_jwt = false
[functions.zuri-media]
verify_jwt = true
[functions.zuri-ai]
verify_jwt = false

# Public place discovery uses a server-held provider key.
[functions.geoapify-places]
verify_jwt = false
